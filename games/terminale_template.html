<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Terminale HPD</title>
<style>
:root{
  --bg:#0A0918;--panel:#0F0E22;--line:#1F5F5A;--fg:#5EEAD4;--dim:#6FA9A2;--pink:#FF6FAE;--bad:#FF8FA3;--ok:#8CF5C8;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0,#14123a 0,var(--bg) 60%);color:var(--fg);font:16px/1.55 var(--mono);
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
/* scanline e vignettatura, solo decorative */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.0) 0,rgba(0,0,0,.0) 2px,rgba(0,0,0,.18) 3px);opacity:.55}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;box-shadow:inset 0 0 120px rgba(0,0,0,.7)}
.term{position:relative;z-index:2;max-width:640px;margin:0 auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  box-shadow:0 0 0 1px #0007,0 0 28px rgba(94,234,212,.12)}
.bar{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.bar b{color:var(--pink);font-weight:700}
.glow{text-shadow:0 0 6px rgba(94,234,212,.55)}
.files{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.files button{min-width:48px;min-height:48px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);font:inherit;cursor:pointer}
.files button[aria-pressed="true"]{border-color:var(--pink);color:var(--pink);box-shadow:0 0 10px rgba(255,111,174,.35) inset}
.files button.done::after{content:" ✓";color:var(--ok)}
.files button:hover{border-color:var(--fg)}
.cur{padding:0 12px 8px;color:var(--dim);font-size:.85rem}
.cur b{color:var(--fg);font-weight:700}
#log{min-height:210px;max-height:46dvh;overflow:auto;padding:4px 12px 12px;border-top:1px dashed var(--line);margin-top:4px}
.ln{margin:2px 0;white-space:pre-wrap;word-break:break-word}
.ln.sys{color:var(--dim)}
.ln.me{color:var(--fg)}
.ln.ok{color:var(--ok)}
.ln.no{color:var(--bad)}
.ln.hint{color:var(--pink)}
form{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
form .p{color:var(--pink);font-weight:700}
input{flex:1;min-width:0;min-height:48px;padding:6px 8px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:inherit;font-size:1rem;caret-color:var(--pink);
  text-transform:uppercase}
input::placeholder{color:#6FA9A2}
input:focus-visible,button:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:4px}
.act{display:flex;gap:8px;padding:0 12px 12px}
.act button{flex:1;min-height:48px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);font:inherit;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.act .go{background:var(--pink);border-color:var(--pink);color:#12112B;font-weight:700}
.act button:active{transform:translateY(1px)}
.cursor{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:var(--fg);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shake{animation:shake .28s}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}.shake{animation:none}body::before{opacity:.25}}
@media (max-width:420px){.bar{font-size:.7rem}}
</style></head><body>
<main class="term" aria-labelledby="t">
<div class="bar"><span id="t" class="glow">HPD · Sezione Omicidi</span><span><b>●</b> linea sicura</span></div>
<div class="files" id="files" role="group" aria-label="File del caso"></div>
<div class="cur" id="cur" aria-live="polite"></div>
<div id="log" role="log" aria-live="polite" aria-label="Registro del terminale" tabindex="0"></div>
<form id="f" autocomplete="off">
  <span class="p" aria-hidden="true">&gt;</span>
  <input id="r" aria-label="Risposta" placeholder="scrivi la risposta" autocapitalize="characters" spellcheck="false" enterkeyhint="send">
</form>
<div class="act"><button class="go" id="verifica" type="button">Esegui</button><button id="aiuto" type="button">Aiuto</button></div>
</main>
<script>
const SALE="@@SALE@@",DATI=@@DATI@@;
function norm(s){return s.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Z0-9]/g,"")}
function h32(s,seed){let x=seed>>>0;const b=new TextEncoder().encode(s);for(const c of b){x^=c;x=Math.imul(x,16777619)>>>0}return x}
function imp(s){s=SALE+norm(s);return h32(s,2166136261).toString(16).padStart(8,"0")+h32(s,2654435761).toString(16).padStart(8,"0")}
const $=id=>document.getElementById(id);
const calmo=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur=-1;const stato=DATI.map(()=>({p:0,a:0}));
let coda=Promise.resolve();

function riga(testo,cls){
  coda=coda.then(()=>new Promise(res=>{
    const d=document.createElement("div");d.className="ln "+(cls||"");$("log").appendChild(d);
    const fine=()=>{$("log").scrollTop=$("log").scrollHeight;res()};
    if(calmo||testo.length>220){d.textContent=testo;fine();return}
    let i=0;const passo=Math.max(1,Math.ceil(testo.length/60));
    const t=setInterval(()=>{i+=passo;d.textContent=testo.slice(0,i);$("log").scrollTop=$("log").scrollHeight;if(i>=testo.length){clearInterval(t);fine()}},14);
  }));
}
function decodifica(testo,cls){
  // l'effetto "decifrazione" è solo estetico: con movimento ridotto il testo compare subito
  if(calmo){riga(testo,cls);return}
  coda=coda.then(()=>new Promise(res=>{
    const d=document.createElement("div");d.className="ln "+(cls||"");$("log").appendChild(d);
    const set="01#%@$&?/\\<>";let n=0;const L=testo.length;
    const t=setInterval(()=>{n+=Math.ceil(L/22);let s=testo.slice(0,n);
      for(let k=n;k<Math.min(L,n+12);k++)s+=testo[k]===" "?" ":set[Math.floor(Math.random()*set.length)];
      d.textContent=s;$("log").scrollTop=$("log").scrollHeight;
      if(n>=L){clearInterval(t);d.textContent=testo;res()}},30);
  }));
}
function giusto(pa,txt){
  if(pa.mode==="cifre"){return imp(txt.replace(/[^0-9]/g,""))===pa.gruppi[0][0]}
  const parole=txt.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^A-Z0-9]+/).filter(Boolean);
  const hs=new Set(parole.map(imp));
  return pa.gruppi.every(g=>g.some(h=>hs.has(h)));
}
function passoCorrente(e,st){return e.passi[Math.min(st.p,e.passi.length-1)]}
function aggiornaChip(){
  document.querySelectorAll("#files button").forEach((b,i)=>{
    b.setAttribute("aria-pressed",String(i===cur));
    b.classList.toggle("done",stato[i].p>=DATI[i].passi.length);
  });
}
function apri(i){
  cur=i;const e=DATI[i],st=stato[i];aggiornaChip();
  $("cur").innerHTML="FILE <b>"+String(e.id).padStart(2,"0")+"</b> · "+e.titolo.toUpperCase()+(e.passi.length>1?" · PASSO "+(Math.min(st.p,e.passi.length-1)+1)+"/"+e.passi.length:"");
  riga("> apri file "+String(e.id).padStart(2,"0"),"me");
  if(st.p>=e.passi.length){riga("File già decifrato.","ok")}
  else{riga(passoCorrente(e,st).domanda,"sys")}
  $("r").focus({preventScroll:true});
}
function esegui(){
  if(cur<0){riga("Scegli prima un file.","no");return}
  const e=DATI[cur],st=stato[cur],t=$("r").value.trim();
  if(st.p>=e.passi.length){riga("File già decifrato.","ok");return}
  if(!t){riga("Nessun input.","no");return}
  riga("> "+t.toUpperCase(),"me");$("r").value="";
  const pa=e.passi[st.p];
  if(giusto(pa,t)){
    riga("[ACCESSO CONCESSO]","ok");decodifica(pa.ok,"ok");st.p++;st.a=0;
    coda=coda.then(()=>{aggiornaChip();$("cur").innerHTML="FILE <b>"+String(e.id).padStart(2,"0")+"</b> · "+e.titolo.toUpperCase()+(st.p>=e.passi.length?" · DECIFRATO":" · PASSO "+(st.p+1)+"/"+e.passi.length)});
    if(st.p<e.passi.length){riga(e.passi[st.p].domanda,"sys")}
  }else{
    riga("[ACCESSO NEGATO] Riprovate.","no");
    if(!calmo){document.querySelector(".term").classList.remove("shake");void document.querySelector(".term").offsetWidth;document.querySelector(".term").classList.add("shake")}
  }
}
function aiuto(){
  if(cur<0){riga("Scegli prima un file.","no");return}
  const e=DATI[cur],st=stato[cur];
  if(st.p>=e.passi.length){riga("File già decifrato: nessun aiuto necessario.","sys");return}
  const pa=passoCorrente(e,st);
  if(st.a>=pa.aiuti.length){riga("Aiuti esauriti. Chiedete al tenente.","no");return}
  st.a++;riga("[AIUTO "+st.a+"/"+pa.aiuti.length+"] "+pa.aiuti[st.a-1],"hint");
}
DATI.forEach((e,i)=>{const b=document.createElement("button");b.type="button";b.textContent=String(e.id).padStart(2,"0");
  b.setAttribute("aria-label","File "+e.id+": "+e.titolo);b.onclick=()=>apri(i);$("files").appendChild(b)});
$("f").addEventListener("submit",ev=>{ev.preventDefault();esegui()});
$("verifica").onclick=esegui;$("aiuto").onclick=aiuto;
riga("KAPU-NET v2.004 · Polizia di Honolulu, Sezione Omicidi","sys");
riga("Connessione sicura… ok. 8 file in coda.","sys");
riga("Scegli un file, scrivi la risposta, premi Esegui. Gli aiuti arrivano uno alla volta.","sys");
</script></body></html>
